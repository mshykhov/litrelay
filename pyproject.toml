[project]
name = "litrelay"
version = "0.2.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["translation", "literature", "epub", "glossary", "llm"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: Text Processing :: Linguistic"]
description = "Resumable literary translation with stable terminology and portable book exports."
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/mshykhov/litrelay"
Issues = "https://github.com/mshykhov/litrelay/issues"

[project.scripts]
litrelay = "litrelay.cli:main"
novel-translation = "litrelay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/litrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
